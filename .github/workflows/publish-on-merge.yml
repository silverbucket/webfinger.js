name: Publish to NPM on Release PR Merge
run-name: Publish release build #${{ github.run_number }}

on:
  pull_request:
    types: [closed]
    branches: [master, main]

jobs:
  publish:
    # Only run if PR was merged and head branch starts with 'release/'
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run linting
        run: bun run lint

      - name: Build project
        run: bun run build

      # Publishing uses npm Trusted Publishing (OIDC): the job's id-token
      # permission is exchanged for a short-lived publish credential, so no
      # NPM_TOKEN secret is needed. setup-node v7+ no longer writes a
      # placeholder auth token to .npmrc when registry-url is set, which
      # would otherwise override OIDC.
      - name: Setup Node.js for npm publish
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports Trusted Publishing (>= 11.5.1)
        run: |
          npm install -g npm@latest
          npm --version

      - name: Get version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Extract release notes for current version
        id: release_notes
        run: |
          # Extract just the current version's notes from CHANGELOG.md
          VERSION="v${{ steps.version.outputs.version }}"
          
          if [ -f CHANGELOG.md ]; then
            # Find the section for this version and extract until the next version or end of file
            awk "/^## $VERSION - \([0-9-]+\)$/{flag=1; next} /^## v[0-9]+\.[0-9]+\.[0-9]+ - \([0-9-]+\)$/{flag=0} flag" CHANGELOG.md > current_release_notes.txt
            
            # Add installation and links sections
            cat >> current_release_notes.txt << EOF
          
          ## 📦 Installation
          
          \`\`\`bash
          # Using bun (recommended)
          bun add webfinger.js@${{ steps.version.outputs.version }}
          
          # Using npm
          npm install webfinger.js@${{ steps.version.outputs.version }}
          
          # Using yarn
          yarn add webfinger.js@${{ steps.version.outputs.version }}
          \`\`\`
          
          ## 🔗 Links
          
          - [NPM Package](https://www.npmjs.com/package/webfinger.js/v/${{ steps.version.outputs.version }})
          - [Documentation](https://github.com/silverbucket/webfinger.js#readme)
          - [Live Demo](https://silverbucket.github.io/webfinger.js/)
          
          ---
          🚀 Generated with automated release workflow
          EOF
          else
            echo "❌ FATAL: CHANGELOG.md file not found"
            echo "Release process requires CHANGELOG.md to extract release notes"
            exit 1
          fi
          
          # Verify release notes were extracted successfully - FAIL if not found
          if [ -s current_release_notes.txt ]; then
            echo "✅ Release notes extracted successfully for $VERSION"
            echo "📄 Release notes preview:"
            head -10 current_release_notes.txt
            if [ $(wc -l < current_release_notes.txt) -gt 10 ]; then
              echo "... (truncated for preview)"
            fi
          else
            echo "❌ FATAL: No release notes found for $VERSION in CHANGELOG.md"
            echo "Expected format: ## $VERSION - (YYYY-MM-DD)"
            echo "Available versions in CHANGELOG.md:"
            grep "^## v" CHANGELOG.md || echo "No version entries found"
            exit 1
          fi

      - name: Check if version already published to npm
        id: npm_check
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NPM_VIEW_OUTPUT="$(npm view "webfinger.js@${VERSION}" version 2>&1)" && {
            echo "Version ${VERSION} is already published to npm, skipping publish."
            echo "already_published=true" >> $GITHUB_OUTPUT
          } || {
            if printf '%s\n' "$NPM_VIEW_OUTPUT" | grep -qE 'E404|404 Not Found|is not in this registry'; then
              echo "Version ${VERSION} not yet on npm, proceeding with release."
              echo "already_published=false" >> $GITHUB_OUTPUT
            else
              echo "Failed to check npm registry for version ${VERSION}:"
              printf '%s\n' "$NPM_VIEW_OUTPUT"
              exit 1
            fi
          }

      - name: Publish to npm
        if: steps.npm_check.outputs.already_published == 'false'
        id: npm_publish
        run: npm publish --provenance

      # Tag and release only AFTER the package is on npm. If publish fails,
      # nothing public is created and the job can simply be re-run.
      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Create and push git tag
        run: |
          git tag -f v${{ steps.version.outputs.version }}
          git push --force origin v${{ steps.version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        run: |
          VERSION="v${{ steps.version.outputs.version }}"
          if gh release view "$VERSION" > /dev/null 2>&1; then
            gh release edit "$VERSION" \
              --title "Release $VERSION" \
              --notes-file current_release_notes.txt
          else
            gh release create "$VERSION" \
              --title "Release $VERSION" \
              --notes-file current_release_notes.txt
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add already published summary
        if: steps.npm_check.outputs.already_published == 'true'
        run: |
          echo "## ⏭️ NPM Version Already Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "v${{ steps.version.outputs.version }} is already on npm. Git tag and GitHub release were updated, npm publish skipped." >> $GITHUB_STEP_SUMMARY

      - name: Add publish summary
        if: steps.npm_check.outputs.already_published == 'false'
        run: |
          echo "## 📦 NPM Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: v${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Git Tag**: v${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub Release**: https://github.com/silverbucket/webfinger.js/releases/tag/v${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **NPM Package**: https://www.npmjs.com/package/webfinger.js/v/${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Demo**: https://silverbucket.github.io/webfinger.js/" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Release is now complete!"

      - name: Alert on NPM publish failure
        if: failure() && steps.npm_publish.conclusion == 'failure'
        run: |
          VERSION="v${PKG_VERSION}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "## 🚨 NPM Publish Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "❌ **npm publish failed** for $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "⏸️ **No git tag or GitHub release was created** (they are only created after a successful publish)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**To recover:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Check the \`Publish to npm\` step log. An \`E404 ... PUT\`, \`E403\` or \`ENEEDAUTH\` error means the npm Trusted Publisher for this repo/workflow is missing or misconfigured on npmjs.com, or the runner's npm is older than 11.5.1." >> $GITHUB_STEP_SUMMARY
          echo "2. On npmjs.com open webfinger.js → Settings → Trusted Publisher and confirm: owner \`silverbucket\`, repository \`webfinger.js\`, workflow \`publish-on-merge.yml\`, no environment." >> $GITHUB_STEP_SUMMARY
          echo "3. Re-run the failed job: \`gh run rerun ${GITHUB_RUN_ID} --failed\`. The rerun publishes, then tags and creates the release." >> $GITHUB_STEP_SUMMARY

          gh issue create --title "NPM Publish Failed for $VERSION" \
            --body "$(cat <<ISSUE_BODY
          The release PR was merged but \`npm publish\` failed, so the release is **not** complete.

          **Status:**
          - npm publish: failed ($RUN_URL)
          - Git tag $VERSION: not created
          - GitHub release $VERSION: not created

          **To recover:**
          1. Check the \`Publish to npm\` step log. An \`E404 ... PUT\`, \`E403\` or \`ENEEDAUTH\` error means the npm Trusted Publisher for this repo/workflow is missing or misconfigured on npmjs.com, or the runner's npm is older than 11.5.1.
          2. On npmjs.com open webfinger.js → Settings → Trusted Publisher and confirm: owner \`silverbucket\`, repository \`webfinger.js\`, workflow \`publish-on-merge.yml\`, no environment.
          3. Re-run the failed job: \`gh run rerun ${GITHUB_RUN_ID} --failed\`. The rerun publishes to npm, then creates the tag and GitHub release.

          Close this issue once https://www.npmjs.com/package/webfinger.js shows $VERSION.
          ISSUE_BODY
          )" \
            --label "bug"
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
